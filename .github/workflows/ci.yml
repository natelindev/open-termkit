name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            docs-site/package-lock.json
      - name: Build embedded frontend and docs
        run: make build
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Static documentation build
        run: VITE_DOCS_STANDALONE=true npm --prefix docs-site run build
