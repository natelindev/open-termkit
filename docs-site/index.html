<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Open Termkit Documentation | Production Web Terminal</title>
    <meta
      name="description"
      content="Official documentation for Open Termkit: Production-grade self-hosted terminal environment built with Go, React, wterm, and SQLite."
    />
    <script>
      (() => {
        try {
          const key = "open-termkit-docs-theme";
          const stored = window.localStorage.getItem(key);
          const theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch {
          // ignore
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
